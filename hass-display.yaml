# Board: Waveshare ESP32-S3-Touch-LCD-2.1B (480x480 round RGB, ST7701S, CST820 touch)
substitutions:
  # Meter ID in the form <serial>_<mpan>, kept in secrets.yaml (it identifies your supply).
  # The Octopus entity IDs below are built from it.
  octopus_meter_id: !secret octopus_meter_id
  # Gas meter ID in the form <serial>_<mprn>, also kept in secrets.yaml
  octopus_gas_meter_id: !secret octopus_gas_meter_id
  # Gas totals: "previous" = yesterday (works with any smart meter);
  # "current" = today so far (needs an Octopus Home Mini)
  gas_period: current
  # Palette (approximation of the Octopus Energy look: deep navy-purple and hot pink)
  color_bg: "0x100030"      # background
  color_pink: "0xF050F8"    # brand accent (icons)
  color_track: "0x2A1466"   # dim ring track
  color_muted: "0x9A8CC4"   # secondary text and idle ring
  color_soft: "0xD9CEF5"    # tertiary text (costs)
  # Backlight turns off after this long without a touch or motion; either wakes it
  screen_timeout: 60s
  # Full scale (the end of the ring, 340 degrees) = this many watts
  ring_max_w: "2000"
  # Colour thresholds (watts): green below amber, amber below red, red at or above
  usage_amber_w: "500"
  usage_red_w: "1200"

esphome:
  name: hass-display
  friendly_name: Hass Display
  on_boot:
    priority: -100
    then:
      - pcf85063.read_time:
      - script.execute: screen_timeout_script

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic   # saves IRAM, as suggested by the boot log
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Helps RGB panels stay stable while PSRAM is busy (flicker / drift)
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  on_client_connected:
    - logger.log: "DEBUG: HA API client connected"
  on_client_disconnected:
    - logger.log: "DEBUG: HA API client disconnected"
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:   # reuses the API encryption key; no password needed

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # avoids display glitches from Wi-Fi sleep/wake bursts
  ap:
    ssid: Hass Display Fallback Hotspot
    password: !secret ap_password

captive_portal:

i2c:
  - id: i2c_bus
    sda: GPIO15
    scl: GPIO7

# IO expander: LCD reset/CS and touch reset live here
pca9554:
  - id: p_c_a
    address: 0x20
    i2c_id: i2c_bus

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO6
    frequency: 5000Hz   # high enough to avoid beating against the panel refresh

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    gamma_correct: 1

touchscreen:
  - platform: cst816   # CST820 is driven by the cst816 platform
    id: my_touchscreen
    i2c_id: i2c_bus
    reset_pin:
      pca9554: p_c_a
      number: 1
    interrupt_pin: GPIO16
    calibration:
      x_min: 0
      x_max: 430   # non-linear on the left edge
      y_min: 0
      y_max: 480
    on_touch:
      then:
        - if:
            condition:
              light.is_off: display_backlight
            then:
              - light.turn_on:
                  id: display_backlight
                  transition_length: 200ms
        - script.execute: screen_timeout_script
    on_update:
      then:
        # A finished touch (state 6) that moved mostly sideways by more than 80px is a swipe
        - lambda: |-
            for (auto touch : touches) {
              if (touch.state == 6) {
                int dx = (int) touch.x_prev - (int) touch.x_org;
                int dy = (int) touch.y_prev - (int) touch.y_org;
                if (abs(dx) > 80 && abs(dx) > 2 * abs(dy)) id(swipe_dir) = (dx < 0) ? 1 : 2;
              }
            }
        - if:
            condition:
              lambda: 'return id(swipe_dir) == 1;'
            then:
              - lvgl.page.next:
                  animation: MOVE_LEFT
                  time: 300ms
        - if:
            condition:
              lambda: 'return id(swipe_dir) == 2;'
            then:
              - lvgl.page.previous:
                  animation: MOVE_RIGHT
                  time: 300ms
        - lambda: 'id(swipe_dir) = 0;'

spi:
  - id: spi_lcd
    clk_pin: GPIO2
    mosi_pin: GPIO1
    interface: spi3

display:
  - platform: st7701s
    id: screen
    spi_mode: MODE0
    data_rate: 40MHz
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 480
      height: 480
    cs_pin:
      pca9554: p_c_a
      number: 2
    reset_pin:
      pca9554: p_c_a
      number: 0
    de_pin: GPIO40
    hsync_pin: GPIO38
    vsync_pin: GPIO39
    pclk_pin: GPIO41
    pclk_frequency: 14MHz   # tuning for shimmer: was 16MHz, tried 12MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_back_porch: 10
    hsync_front_porch: 50
    vsync_pulse_width: 3
    vsync_back_porch: 8
    vsync_front_porch: 8
    data_pins:
      red:
        - 46   # r1
        - 3    # r2
        - 8    # r3
        - 18   # r4
        - 17   # r5
      green:
        - 14   # g0
        - 13   # g1
        - 12   # g2
        - 11   # g3
        - 10   # g4
        - 9    # g5
      blue:
        - 5    # b1
        - 45   # b2
        - 48   # b3
        - 47   # b4
        - 21   # b5
    init_sequence:
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0B, 0x02]
      - [0xC2, 0x07, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x06, 0x05, 0x09, 0x08, 0x21, 0x06, 0x13, 0x10, 0x29, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x07, 0x05, 0x09, 0x09, 0x21, 0x05, 0x13, 0x11, 0x2a, 0x31, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x6d]
      - [0xB1, 0x37]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x66]
      - [0x11]
      - delay 120ms
      - [0x29]
      - delay 20ms

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf85063.write_time:
  - platform: pcf85063
    id: rtc_time
    i2c_id: i2c_bus
    update_interval: never

font:
  - file: "gfonts://Montserrat"
    id: font_cost
    size: 24
    bpp: 4
    glyphs: "£0123456789.,-"
  # Icon font: Material Design Icons (mdi:fire = U+F0238, mdi:flash = U+F0241)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icons
    size: 28
    bpp: 4
    glyphs: ["\U000F0238", "\U000F0241"]

# Octopus artwork, downloaded from the GitHub repo at compile time (needs internet)
image:
  - platform: file
    file: "https://raw.githubusercontent.com/jonas-olofsson/esp32-lcd/main/octopus.png"
    id: octo_small
    resize: 48x48
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: "https://raw.githubusercontent.com/jonas-olofsson/esp32-lcd/main/octopus.png"
    id: octo_big
    resize: 220x220
    type: RGB565
    transparency: alpha_channel

lvgl:
  id: my_lvgl
  buffer_size: 40%
  touchscreens:
    - touchscreen_id: my_touchscreen
  pages:
    - id: main_page
      bg_color: ${color_bg}
      widgets:
        # Usage ring: runs from 20 to 340 degrees (gap at the bottom for the usage text), full scale = ring_max_w
        - arc:
            id: usage_arc
            align: CENTER
            width: 480
            height: 480
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 20
            arc_rounded: false
            arc_color: ${color_track}   # dim track
            indicator:
              arc_width: 20
              arc_rounded: false
              arc_color: ${color_muted}
        - image:
            src: octo_small
            align: CENTER
            y: -140
        # Daily electricity usage: the main focus
        - obj:
            id: elec_row
            align: CENTER
            y: -70
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  text: "\U000F0241"
                  text_color: ${color_pink}
                  text_font: font_icons
              - label:
                  pad_left: 10
                  id: today_kwh_label
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_40
              - label:
                  pad_left: 10
                  text: "kWh"
                  text_color: ${color_muted}
                  text_font: montserrat_20
              - label:
                  pad_left: 10
                  id: today_cost_label
                  text: "£--"
                  text_color: ${color_soft}
                  text_font: font_cost
        # Daily gas usage and cost
        - obj:
            id: gas_row
            align: CENTER
            y: 0
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  text: "\U000F0238"
                  text_color: ${color_pink}
                  text_font: font_icons
              - label:
                  pad_left: 10
                  id: gas_kwh_label
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_40
              - label:
                  pad_left: 10
                  text: "kWh"
                  text_color: ${color_muted}
                  text_font: montserrat_20
              - label:
                  pad_left: 10
                  id: gas_cost_label
                  text: "£--"
                  text_color: ${color_soft}
                  text_font: font_cost
        # Electricity price: small, below the gas row
        - obj:
            id: price_row
            align: CENTER
            y: 70
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  text: "\U000F0241"
                  text_color: ${color_pink}
                  text_font: font_icons
              - label:
                  pad_left: 12
                  id: rate_label
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_28
              - label:
                  pad_left: 12
                  id: next_label
                  text: "next --"
                  text_color: ${color_muted}
                  text_font: montserrat_16
        - label:
            id: export_label
            text: ""
            align: BOTTOM_MID
            y: -50
            text_color: 0x00E5FF
            text_font: montserrat_14
        - label:
            id: usage_label
            text: "-- W"
            align: BOTTOM_MID
            y: -14
            text_color: 0xFFFFFF
            text_font: montserrat_28
    # Page 2: just the logo. Swipe left or right to switch pages.
    - id: logo_page
      bg_color: ${color_bg}
      widgets:
        - image:
            src: octo_big
            align: CENTER

sensor:
  # The integration reports GBP/kWh, so values are multiplied by 100 for pence
  - platform: homeassistant
    id: octo_rate
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_rate
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("octopus", "current rate (GBP/kWh): %.5f", x);
        - lvgl.label.update:
            id: rate_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              return str_sprintf("%.1fp", x * 100.0f);
        # Colour by price: cyan = negative, green = cheap, white = normal, orange/red = expensive
        - lvgl.widget.update:
            id: rate_label
            text_color: !lambda |-
              if (std::isnan(x)) return lv_color_hex(${color_muted});
              float p = x * 100.0f;
              if (p < 0) return lv_color_hex(0x00E5FF);
              if (p < 15) return lv_color_hex(0x2ECC71);
              if (p < 30) return lv_color_hex(0xFFFFFF);
              if (p < 40) return lv_color_hex(0xFFA500);
              return lv_color_hex(0xFF4444);

  - platform: homeassistant
    id: octo_next_rate
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_next_rate
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("octopus", "next rate (GBP/kWh): %.5f", x);
        - lvgl.label.update:
            id: next_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("next --");
              return str_sprintf("next %.1fp", x * 100.0f);

  # Live usage in watts. Positive = importing: the ring fills from its start (bottom left).
  # Negative = exporting: the ring fills from the opposite end (bottom right) in cyan,
  # and an EXPORTING caption appears above the number.
  - platform: homeassistant
    id: octo_usage
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_demand
    internal: true
    filters:
      - throttle: 2s     # at most one redraw every 2 seconds
      - delta: 10        # ignore changes smaller than 10 W
    on_value:
      then:
        - lvgl.label.update:
            id: usage_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("-- W");
              float a = fabsf(x);
              if (a >= 1000) return str_sprintf("%.2f kW", a / 1000.0f);
              return str_sprintf("%.0f W", a);
        - lvgl.label.update:
            id: export_label
            text: !lambda |-
              return std::string((!std::isnan(x) && x < 0) ? "EXPORTING" : "");
        - lambda: |-
            bool exporting = !std::isnan(x) && x < 0;
            lv_color_t c;
            if (std::isnan(x)) c = lv_color_hex(${color_muted});
            else if (exporting) c = lv_color_hex(0x00E5FF);
            else if (x >= ${usage_red_w}) c = lv_color_hex(0xFF2D2D);
            else if (x >= ${usage_amber_w}) c = lv_color_hex(0xFFA500);
            else c = lv_color_hex(0x2ECC71);
            int mag = std::isnan(x) ? 0 : (int) fabsf(x);
            if (mag > ${ring_max_w}) mag = ${ring_max_w};
            lv_obj_t *a = id(usage_arc);
            // REVERSE fills from the end of the arc backwards, so value = max - export
            lv_arc_set_mode(a, exporting ? LV_ARC_MODE_REVERSE : LV_ARC_MODE_NORMAL);
            lv_arc_set_value(a, exporting ? ${ring_max_w} - mag : mag);
            lv_obj_set_style_arc_color(a, c, LV_PART_INDICATOR);
            lv_color_t t = lv_color_hex(0xFFFFFF);
            if (std::isnan(x)) t = lv_color_hex(${color_muted});
            else if (exporting) t = lv_color_hex(0x00E5FF);
            else if (x >= ${usage_red_w}) t = lv_color_hex(0xFF2D2D);
            else if (x >= ${usage_amber_w}) t = lv_color_hex(0xFFA500);
            lv_obj_set_style_text_color(id(usage_label), t, 0);

  # Today so far
  - platform: homeassistant
    id: octo_today_kwh
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_accumulative_consumption
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: today_kwh_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              return str_sprintf("%.1f", x);

  - platform: homeassistant
    id: octo_today_cost
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_accumulative_cost
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: today_cost_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("£--");
              return str_sprintf("£%.2f", x);

  # Gas (daily total and cost). Entity IDs end in the unit for consumption.
  - platform: homeassistant
    id: gas_kwh
    entity_id: sensor.octopus_energy_gas_${octopus_gas_meter_id}_${gas_period}_accumulative_consumption_kwh
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: gas_kwh_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              return str_sprintf("%.1f", x);

  - platform: homeassistant
    id: gas_cost
    entity_id: sensor.octopus_energy_gas_${octopus_gas_meter_id}_${gas_period}_accumulative_cost
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: gas_cost_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("£--");
              return str_sprintf("£%.2f", x);

globals:
  # Set by the swipe detector: 0 = none, 1 = swiped left, 2 = swiped right
  - id: swipe_dir
    type: int
    initial_value: '0'

script:
  # Turns the backlight off after the timeout, unless motion is still detected.
  # mode: restart means every touch or motion event starts the countdown again.
  - id: screen_timeout_script
    mode: restart
    then:
      - delay: ${screen_timeout}
      - if:
          condition:
            binary_sensor.is_off: room_motion
          then:
            - light.turn_off:
                id: display_backlight
                transition_length: 1s

binary_sensor:
  # Motion wakes the display and keeps it on while motion is detected
  - platform: homeassistant
    id: room_motion
    entity_id: binary_sensor.lumi_lumi_sensor_motion_occupancy_3
    internal: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            transition_length: 200ms
        - script.execute: screen_timeout_script
    on_release:
      then:
        - script.execute: screen_timeout_script
