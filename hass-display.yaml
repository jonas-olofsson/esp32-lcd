# Board: Waveshare ESP32-S3-Touch-LCD-2.1B (480x480 round RGB, ST7701S, CST820 touch)
substitutions:
  # Meter ID in the form <serial>_<mpan>, kept in secrets.yaml (it identifies your supply).
  # The Octopus entity IDs below are built from it.
  octopus_meter_id: !secret octopus_meter_id
  # Backlight turns off after this long without a touch or motion; either wakes it
  screen_timeout: 60s
  # Full scale (the end of the ring, 340 degrees) = this many watts
  ring_max_w: "2000"
  # Colour thresholds (watts): green below amber, amber below red, red at or above
  usage_amber_w: "500"
  usage_red_w: "1200"

esphome:
  name: hass-display
  friendly_name: Hass Display
  on_boot:
    priority: -100
    then:
      - pcf85063.read_time:
      - script.execute: screen_timeout_script

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # Helps RGB panels stay stable while PSRAM is busy (flicker / drift)
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  on_client_connected:
    - logger.log: "DEBUG: HA API client connected"
  on_client_disconnected:
    - logger.log: "DEBUG: HA API client disconnected"
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:   # reuses the API encryption key; no password needed

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Hass Display Fallback Hotspot
    password: !secret ap_password

captive_portal:

i2c:
  - id: i2c_bus
    sda: GPIO15
    scl: GPIO7

# IO expander: LCD reset/CS and touch reset live here
pca9554:
  - id: p_c_a
    address: 0x20
    i2c_id: i2c_bus

output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO6
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    gamma_correct: 1

touchscreen:
  - platform: cst816   # CST820 is driven by the cst816 platform
    id: my_touchscreen
    i2c_id: i2c_bus
    reset_pin:
      pca9554: p_c_a
      number: 1
    interrupt_pin: GPIO16
    calibration:
      x_min: 0
      x_max: 430   # non-linear on the left edge
      y_min: 0
      y_max: 480
    on_touch:
      then:
        - if:
            condition:
              light.is_off: display_backlight
            then:
              - light.turn_on:
                  id: display_backlight
                  transition_length: 200ms
        - script.execute: screen_timeout_script

spi:
  - id: spi_lcd
    clk_pin: GPIO2
    mosi_pin: GPIO1
    interface: spi3

display:
  - platform: st7701s
    id: screen
    spi_mode: MODE0
    data_rate: 40MHz
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 480
      height: 480
    cs_pin:
      pca9554: p_c_a
      number: 2
    reset_pin:
      pca9554: p_c_a
      number: 0
    de_pin: GPIO40
    hsync_pin: GPIO38
    vsync_pin: GPIO39
    pclk_pin: GPIO41
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_pulse_width: 8
    hsync_back_porch: 10
    hsync_front_porch: 50
    vsync_pulse_width: 3
    vsync_back_porch: 8
    vsync_front_porch: 8
    data_pins:
      red:
        - 46   # r1
        - 3    # r2
        - 8    # r3
        - 18   # r4
        - 17   # r5
      green:
        - 14   # g0
        - 13   # g1
        - 12   # g2
        - 11   # g3
        - 10   # g4
        - 9    # g5
      blue:
        - 5    # b1
        - 45   # b2
        - 48   # b3
        - 47   # b4
        - 21   # b5
    init_sequence:
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0B, 0x02]
      - [0xC2, 0x07, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x06, 0x05, 0x09, 0x08, 0x21, 0x06, 0x13, 0x10, 0x29, 0x31, 0x18]
      - [0xB1, 0x00, 0x11, 0x16, 0x0e, 0x11, 0x07, 0x05, 0x09, 0x09, 0x21, 0x05, 0x13, 0x11, 0x2a, 0x31, 0x18]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x6d]
      - [0xB1, 0x37]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x00]
      - [0x3A, 0x66]
      - [0x11]
      - delay 120ms
      - [0x29]
      - delay 20ms

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf85063.write_time:
  - platform: pcf85063
    id: rtc_time
    i2c_id: i2c_bus
    update_interval: never

font:
  - file: "gfonts://Montserrat"
    id: font_cost
    size: 24
    bpp: 4
    glyphs: "£0123456789.,-"

lvgl:
  id: my_lvgl
  buffer_size: 40%
  touchscreens:
    - touchscreen_id: my_touchscreen
  pages:
    - id: main_page
      bg_color: 0x0A0A0F
      widgets:
        # Usage ring: runs from 20 to 340 degrees (gap at the bottom for the usage text), full scale = ring_max_w, with an inward glow
        - arc:
            id: usage_arc
            align: CENTER
            width: 480
            height: 480
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 20
            arc_rounded: false
            arc_color: 0x26262E   # dim track
            indicator:
              arc_width: 20
              arc_rounded: false
              arc_color: 0x444444
        - arc:
            id: usage_glow_1
            align: CENTER
            width: 440
            height: 440
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 10
            arc_rounded: false
            arc_opa: TRANSP
            indicator:
              arc_width: 10
              arc_rounded: false
              arc_color: 0x444444
              arc_opa: 60%
        - arc:
            id: usage_glow_2
            align: CENTER
            width: 420
            height: 420
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 10
            arc_rounded: false
            arc_opa: TRANSP
            indicator:
              arc_width: 10
              arc_rounded: false
              arc_color: 0x444444
              arc_opa: 42%
        - arc:
            id: usage_glow_3
            align: CENTER
            width: 400
            height: 400
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 10
            arc_rounded: false
            arc_opa: TRANSP
            indicator:
              arc_width: 10
              arc_rounded: false
              arc_color: 0x444444
              arc_opa: 28%
        - arc:
            id: usage_glow_4
            align: CENTER
            width: 380
            height: 380
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 10
            arc_rounded: false
            arc_opa: TRANSP
            indicator:
              arc_width: 10
              arc_rounded: false
              arc_color: 0x444444
              arc_opa: 16%
        - arc:
            id: usage_glow_5
            align: CENTER
            width: 360
            height: 360
            min_value: 0
            max_value: ${ring_max_w}
            value: 0
            start_angle: 20
            end_angle: 340
            rotation: 90          # 0 at the bottom, fills clockwise
            adjustable: false
            clickable: false
            arc_width: 10
            arc_rounded: false
            arc_opa: TRANSP
            indicator:
              arc_width: 10
              arc_rounded: false
              arc_color: 0x444444
              arc_opa: 8%
        - label:
            text: "Octopus Energy"
            align: TOP_MID
            y: 68
            text_color: 0xF050F8
            text_font: montserrat_24
        - label:
            id: rate_label
            text: "--"
            align: CENTER
            y: -50
            text_color: 0xFFFFFF
            text_font: montserrat_48
        - label:
            text: "p/kWh now"
            align: CENTER
            y: 0
            text_color: 0x8A8F98
            text_font: montserrat_24
        - label:
            id: next_label
            text: "Next: --"
            align: CENTER
            y: 30
            text_color: 0xB0B5BD
            text_font: montserrat_24
        - label:
            id: today_kwh_label
            text: "-- kWh"
            align: CENTER
            x: -80
            y: 75
            text_color: 0xFFFFFF
            text_font: montserrat_24
        - label:
            id: today_cost_label
            text: "£--"
            align: CENTER
            x: 80
            y: 75
            text_color: 0xFFFFFF
            text_font: font_cost
        - label:
            id: usage_label
            text: "-- W"
            align: BOTTOM_MID
            y: -14
            text_color: 0xFFFFFF
            text_font: montserrat_28

sensor:
  # The integration reports GBP/kWh, so values are multiplied by 100 for pence
  - platform: homeassistant
    id: octo_rate
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_rate
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("octopus", "current rate (GBP/kWh): %.5f", x);
        - lvgl.label.update:
            id: rate_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              return str_sprintf("%.1f", x * 100.0f);
        # Colour by price: cyan = negative, green = cheap, white = normal, orange/red = expensive
        - lvgl.widget.update:
            id: rate_label
            text_color: !lambda |-
              if (std::isnan(x)) return lv_color_hex(0x8A8F98);
              float p = x * 100.0f;
              if (p < 0) return lv_color_hex(0x00E5FF);
              if (p < 15) return lv_color_hex(0x2ECC71);
              if (p < 30) return lv_color_hex(0xFFFFFF);
              if (p < 40) return lv_color_hex(0xFFA500);
              return lv_color_hex(0xFF4444);

  - platform: homeassistant
    id: octo_next_rate
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_next_rate
    internal: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("octopus", "next rate (GBP/kWh): %.5f", x);
        - lvgl.label.update:
            id: next_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("Next: --");
              return str_sprintf("Next: %.1fp", x * 100.0f);

  # Live usage in watts: drives the usage text and the coloured edge
  - platform: homeassistant
    id: octo_usage
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_demand
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: usage_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("-- W");
              if (x >= 1000) return str_sprintf("%.2f kW", x / 1000.0f);
              return str_sprintf("%.0f W", x);
        - lambda: |-
            lv_color_t c;
            if (std::isnan(x)) c = lv_color_hex(0x444444);
            else if (x >= ${usage_red_w}) c = lv_color_hex(0xFF2D2D);
            else if (x >= ${usage_amber_w}) c = lv_color_hex(0xFFA500);
            else c = lv_color_hex(0x2ECC71);
            int v = std::isnan(x) ? 0 : (int) x;
            lv_obj_t *arcs[] = {id(usage_arc), id(usage_glow_1), id(usage_glow_2),
                                id(usage_glow_3), id(usage_glow_4), id(usage_glow_5)};
            for (lv_obj_t *a : arcs) {
              lv_arc_set_value(a, v);
              lv_obj_set_style_arc_color(a, c, LV_PART_INDICATOR);
            }
            lv_color_t t = lv_color_hex(0xFFFFFF);
            if (std::isnan(x)) t = lv_color_hex(0x8A8F98);
            else if (x >= ${usage_red_w}) t = lv_color_hex(0xFF2D2D);
            else if (x >= ${usage_amber_w}) t = lv_color_hex(0xFFA500);
            lv_obj_set_style_text_color(id(usage_label), t, 0);

  # Today so far
  - platform: homeassistant
    id: octo_today_kwh
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_accumulative_consumption
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: today_kwh_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("-- kWh");
              return str_sprintf("%.1f kWh", x);

  - platform: homeassistant
    id: octo_today_cost
    entity_id: sensor.octopus_energy_electricity_${octopus_meter_id}_current_accumulative_cost
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: today_cost_label
            text: !lambda |-
              if (std::isnan(x)) return std::string("£--");
              return str_sprintf("£%.2f", x);

script:
  # Turns the backlight off after the timeout, unless motion is still detected.
  # mode: restart means every touch or motion event starts the countdown again.
  - id: screen_timeout_script
    mode: restart
    then:
      - delay: ${screen_timeout}
      - if:
          condition:
            binary_sensor.is_off: room_motion
          then:
            - light.turn_off:
                id: display_backlight
                transition_length: 1s

binary_sensor:
  # Motion wakes the display and keeps it on while motion is detected
  - platform: homeassistant
    id: room_motion
    entity_id: binary_sensor.lumi_lumi_sensor_motion_occupancy_3
    internal: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            transition_length: 200ms
        - script.execute: screen_timeout_script
    on_release:
      then:
        - script.execute: screen_timeout_script
